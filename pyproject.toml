[project]
name = "spatial-scaling"
version = "0.1.0"
authors = [
    { name = "AlexisMolinaMR", email = "alexismolmr@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "pyyaml>=6.0.2",
]

[project.scripts]
spatial-scaling-generate-synthetic = "spatial_scaling.data.synthetic.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
